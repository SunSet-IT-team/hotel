name: SSH Deploy

on:
    push:
        branches: [main, dev]
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Decide target (dir/project/services)
              id: cfg
              shell: bash
              run: |
                  set -e
                  BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
                  if [ "$BRANCH" = "main" ]; then
                    echo "DIR=hotel"              >> "$GITHUB_OUTPUT"
                    echo "PROJECT=hotel"          >> "$GITHUB_OUTPUT"
                    echo "SERVICES=app-prod"      >> "$GITHUB_OUTPUT"
                    echo "ENV_FILE=.env"          >> "$GITHUB_OUTPUT"
                    echo "PORTS=8080"             >> "$GITHUB_OUTPUT"
                  else
                    echo "DIR=hotel-dev"          >> "$GITHUB_OUTPUT"
                    echo "PROJECT=hotel-dev"      >> "$GITHUB_OUTPUT"
                    echo "SERVICES=app storybook" >> "$GITHUB_OUTPUT"
                    echo "ENV_FILE=.env.dev"      >> "$GITHUB_OUTPUT"
                    echo "PORTS=3000 6006"        >> "$GITHUB_OUTPUT"
                  fi

            - name: Precheck secrets
              env:
                  SSH_HOST: ${{ secrets.SERVER_HOST }}
                  SSH_USER: ${{ secrets.SERVER_USER }}
                  SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
              run: |
                  set -e
                  [ -n "$SSH_HOST" ] || { echo "Missing SERVER_HOST secret"; exit 1; }
                  [ -n "$SSH_USER" ] || { echo "Missing SERVER_USER secret"; exit 1; }
                  [ -n "$SSH_KEY"  ] || { echo "Missing SERVER_SSH_KEY secret"; exit 1; }

            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: 22
                  debug: true
                  command_timeout: 45m
                  script: |
                      set -Eeuo pipefail

                      BRANCH="${{ github.ref_name }}"
                      DIR="${{ steps.cfg.outputs.DIR }}"
                      PROJECT="${{ steps.cfg.outputs.PROJECT }}"
                      SERVICES="${{ steps.cfg.outputs.SERVICES }}"
                      ENV_FILE="${{ steps.cfg.outputs.ENV_FILE }}"
                      PORTS="${{ steps.cfg.outputs.PORTS }}"

                      echo "::group::Подготовка"
                      echo "Branch:   $BRANCH"
                      echo "Dir:      $HOME/$DIR"
                      echo "Project:  $PROJECT"
                      echo "Services: $SERVICES"
                      echo "Env file: $ENV_FILE"
                      echo "Ports:    $PORTS"
                      test -d "$HOME/$DIR" || { echo "Ошибка: $HOME/$DIR не найдена"; exit 1; }
                      cd "$HOME/$DIR"
                      test -f "$ENV_FILE" || { echo "Ошибка: $ENV_FILE не найден в $PWD"; exit 1; }
                      echo "::endgroup::"

                      echo "::group::Подтягиваем актуальную версию с github"
                      git fetch --all --prune
                      git reset --hard "origin/$BRANCH"
                      git clean -fd -e .env -e .env.dev
                      echo "HEAD: $(git rev-parse --short HEAD)"
                      echo "::endgroup::"

                      echo "::group::Удаление старых образов"
                      docker compose -p "$PROJECT" down -v --remove-orphans
                      echo "::endgroup::"

                      echo "::group::Полная очистка"
                      docker compose -p "$PROJECT" images -q "$SERVICES" | sort -u | xargs -r docker rmi -f
                      echo "::endgroup::"

                      echo "::group::Билдим без кэша"
                      docker compose -p "$PROJECT" build --no-cache "$SERVICES"
                      echo "::endgroup::"

                      echo "::group::Запускаем сервисы"
                      docker compose -p "$PROJECT" up -d "$SERVICES"
                      docker compose -p "$PROJECT" ps "$SERVICES"
                      echo "::endgroup::"

                      echo "::group::Очистка после окончания всех работ"
                      docker system prune -f
                      echo "::endgroup::"
